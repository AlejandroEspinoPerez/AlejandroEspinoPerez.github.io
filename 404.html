<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Alejandro Espino Pérez</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1022">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<main class="hero" id="main" style="min-height: 100vh; display: grid; place-items: center; text-align: center;">
  <div class="hero-bg" aria-hidden="true"><span class="glow glow-a"></span><span class="glow glow-b"></span></div>
  <div class="container" style="position: relative;">
    <p class="kicker" style="justify-content: center;">404</p>
    <h1 class="hero-name" style="margin-top: 12px;">Page not found</h1>
    <p class="hero-lead" style="margin-inline: auto;">This page doesn't exist. · Esta página no existe.</p>
    <div class="cta-row" style="justify-content: center; margin-top: 28px;">
      <a class="btn btn-primary" href="/">Go to the homepage</a>
      <a class="btn btn-secondary" href="/?lang=es" lang="es">Ir al inicio</a>
    </div>
  </div>
</main>
</body>
</html>
